# fly.toml app configuration file
app = "cn-secure-messenger"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  RELAY_HOST = "127.0.0.1"
  RELAY_PORT = "9999"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
